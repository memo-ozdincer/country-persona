[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "country-persona"
version = "0.1.0"
description = "Evidence-grounded, dated institutional persona data and post-training"
requires-python = ">=3.11,<3.14"
dependencies = ["beautifulsoup4==4.15.0", "truststore==0.10.4"]

[project.optional-dependencies]
data = ["pyreadr==0.5.6", "ijson==3.5.1", "zstandard==0.25.0"]
dev = ["pytest==9.1.1"]
catalog = ["pyarrow==25.0.1", "huggingface_hub==0.36.2"]
tokenize = ["transformers==4.57.6", "jinja2==3.1.6"]
train = ["torch==2.8.0", "transformers==4.57.6", "trl==0.24.0", "peft==0.17.1", "datasets==4.3.0", "accelerate==1.11.0"]
cuda = ["bitsandbytes==0.48.2; sys_platform == 'linux'"]

[dependency-groups]
# Match the measured Aurora research runtime; keep the historical train extra.
research-test = ["torch==2.8.0", "transformers==5.17.0", "trl==1.14.1", "peft==0.21.1", "datasets==5.0.1", "accelerate==1.15.0", "pyarrow==25.0.1"]

[tool.uv]
conflicts = [
    [{ extra = "train" }, { group = "research-test" }],
    [{ extra = "tokenize" }, { group = "research-test" }],
    [{ extra = "catalog" }, { group = "research-test" }],
]

[project.scripts]
persona = "country_persona.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
