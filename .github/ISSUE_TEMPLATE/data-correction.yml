name: Correct a record or count
description: Report an attribution, extraction, count or training-format issue.
title: "[Correction] "
body:
  - type: textarea
    attributes:
      label: Record or source
      description: Country, source name, stable record ID or explorer link.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What is incorrect and what should change
      description: Include the exact field or count, supporting source and suggested correction.
    validations:
      required: true
