name: Add a data source
description: Propose a source or document a newly inspected dataset.
title: "[Source] "
body:
  - type: textarea
    attributes:
      label: Publisher and access
      description: Link the original publisher/dataset and describe access or reuse conditions. Do not include credentials.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Coverage and acquisition status
      description: Countries, languages, dates, reported size, and whether you inspected actual files or only documentation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Available fields and possible trace
      description: What would be input/context, generated output, supervision or reward? What is still missing?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Provenance, examples and overlap
      description: Record references, hashes if acquired, speaker attribution, translation families and overlap with existing data.
